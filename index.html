<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tee's Planner">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e3a5f">
<meta name="format-detection" content="telephone=no">
<title>Tee's Planner</title>
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script>
// Home-screen (standalone) sizing on iPhone.
// 1. iOS reports a viewport that stops short of the bottom of the screen, leaving a dead band.
//    The full height is worked out from the screen size and the whole document is made that tall
//    (styles.css, "html.standalone"); anything positioned against the short viewport gets cut off.
// 2. If the page is being shown zoomed out (text looks small), scale it back to real size.
(function(){
  var root = document.documentElement;
  function fit(){
    var standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
    if (!standalone || !window.screen) return;
    root.classList.add("standalone");
    var portrait = window.innerHeight >= window.innerWidth;
    var shortSide = Math.min(screen.width, screen.height), longSide = Math.max(screen.width, screen.height);
    var screenW = portrait ? shortSide : longSide, screenH = portrait ? longSide : shortSide;
    var ratio = window.innerWidth / screenW;           // CSS px per screen point; 1 when not zoomed
    var zoom = ratio > 1.05 && ratio < 2 ? ratio : 1;
    root.style.zoom = zoom === 1 ? "" : String(zoom);
    root.style.setProperty("--app-h", Math.ceil(screenH * ratio / zoom) + "px");
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function(){ setTimeout(fit, 250); });
})();
</script>
</head>
<body>
<div class="app">
  <aside class="drawer hidden" id="drawer" aria-hidden="true">
    <div class="drawer-panel">
      <div class="drawer-head">
        <div class="drawer-title">Contents</div>
        <button class="iconbtn" id="btnCloseMenu" aria-label="Close contents">
          <svg aria-hidden="true" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 5l12 12M17 5L5 17"/></svg>
        </button>
      </div>
      <nav class="nav">
        <button class="navitem" data-route="dashboard">Today</button>
        <button class="navitem" data-route="goals">Goals</button>
        <button class="navitem" data-route="relationships">People</button>
        <button class="navitem" data-route="finance">Money</button>
        <button class="navitem" data-route="fitness">Wellness</button>
        <button class="navitem" data-route="spiritual">Faith</button>
        <button class="navitem" data-route="weekly">History</button>
        <button class="navitem" data-route="diary">Diary</button>
        <button class="navitem" data-route="partner">Partner</button>
        <button class="navitem" data-route="settings">Settings</button>
        <button class="navitem" id="btnCloseBook">Close the book</button>
      </nav>
      <div class="drawer-foot">
        <div class="drawer-tip">Add to your home screen for the best experience.</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="book">
      <div class="pagehost" id="pageHost"></div>
      <button class="ribbon" id="btnRibbon" aria-label="Go to today"></button>
    </div>
  </main>

  <!-- Index tabs along the bottom edge of the book -->
  <nav class="tabbar" id="edgeTabs" aria-label="Sections">
    <button class="tab" data-route="dashboard">Today</button>
    <button class="tab" data-route="goals">Goals</button>
    <button class="tab" data-route="relationships">People</button>
    <button class="tab" data-route="finance">Money</button>
    <button class="tab" data-route="spiritual">Faith</button>
    <button class="tab" data-route="more">More</button>
  </nav>
</div>

<!-- The cover. It swings open on the spine, then the title page follows. -->
<div id="bookCover">
  <div class="cover-cast" aria-hidden="true"></div>
  <div class="cover-leaf cover-fly" aria-hidden="true">
    <div class="cover-face front">
      <div class="fly-kicker">THIS PLANNER BELONGS TO</div>
      <div class="fly-name" id="flyName">Tee</div>
      <div class="fly-rule"></div>
      <div class="fly-motto">Bloom where you're planted</div>
      <div class="cover-shade"></div>
    </div>
    <div class="cover-face back"><div class="cover-shade"></div></div>
  </div>
  <div class="cover-leaf cover-board">
    <div class="cover-face front">
      <div class="cover-cloth">
        <div class="cover-spine" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="cover-band" aria-hidden="true"></div>
        <div class="cover-plate">
          <div>
            <svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#a8d4ff" stroke-width="1"><path d="M22 40V14"/><path d="M22 22c-7 0-11-4-11-10 7 0 11 4 11 10z"/><path d="M22 28c7 0 11-4 11-10-7 0-11 4-11 10z"/><path d="M22 14c-3-3-3-7 0-10 3 3 3 7 0 10z"/></svg>
            <div class="cover-name" id="coverName">Tee's</div>
            <div class="cover-word">PLANNER</div>
            <div class="cover-rule"></div>
            <div class="cover-year" id="coverYear"></div>
          </div>
        </div>
        <div class="cover-open">
          <div class="cover-date" id="coverDate"></div>
          <button id="btnOpenBook">OPEN PLANNER</button>
        </div>
        <div class="cover-ribbon" aria-hidden="true"></div>
      </div>
      <div class="cover-shade"></div>
    </div>
    <div class="cover-edge" aria-hidden="true"></div>
    <div class="cover-face back" aria-hidden="true"><div class="cover-shade"></div></div>
  </div>
</div>
<script>
  // Skip the cover on a reload within the same visit
  try{ if (sessionStorage.getItem("book_open") === "1") document.getElementById("bookCover").classList.add("gone"); }catch(_){}
</script>

<!-- Modal -->
<div class="modal-backdrop hidden" id="modalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="iconbtn" id="modalClose" aria-label="Close">
        <svg aria-hidden="true" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 5l12 12M17 5L5 17"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
